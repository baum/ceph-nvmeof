#  Performance test specific configuration
#  - Limits reactor threads to 1 using -m 1
#  - Optimized for performance profiling and analysis
#

[gateway]
name =
group =
addr = 0.0.0.0
port = 5500
enable_auth = False
state_update_notify = True
state_update_timeout_in_msec = 2000
state_update_interval_sec = 5
enable_spdk_discovery_controller = False
encryption_key = /etc/ceph/encryption.key
rebalance_period_sec = 7
max_gws_in_grp = 16
max_ns_to_change_lb_grp = 8

[gateway-logs]
log_level=debug

[discovery]
addr = 0.0.0.0
port = 8009

[ceph]
pool = rbd
config_file = /etc/ceph/ceph.conf

# CPU affinity settings for performance testing
# - SPDK reactor threads: CPU 0 (via -m 0x1 in tgt_cmd_extra_args)
# - librbd/librados threads: CPU 1 (via ceph config)
# This separates SPDK and Ceph processing for cleaner performance analysis

[mtls]
server_key = ./server.key
client_key = ./client.key
server_cert = ./server.crt
client_cert = ./client.crt

[spdk]
bdevs_per_cluster = 32
mem_size=4096
tgt_path = /usr/local/bin/nvmf_tgt
timeout = 60.0

# Performance test specific: Limit reactor threads to 1 using -m 0x1
# This ensures single-threaded execution for more predictable performance profiling
tgt_cmd_extra_args = -m 0x1

# CPU affinity for librbd/librados threads - use CPU 1 (second CPU)
# This separates SPDK (CPU 0) and Ceph (CPU 1) processing for cleaner analysis
librbd_core_mask = 0x2

# TCP transport options optimized for performance testing
transport_tcp_options = {"in_capsule_data_size" : 8192, "max_io_qpairs_per_ctrlr" : 7}

[monitor]
#timeout = 1.0
#log_file_dir =
